name: mini-erp-identity

# Local development only. This starts the provider; it does not enable ERP login.
services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.8.1
    command: ["start-dev", "--import-realm"]
    restart: unless-stopped
    environment:
      KC_HOSTNAME: http://localhost:18090
    ports:
      - "127.0.0.1:18090:8080"
    volumes:
      - identity-data:/opt/keycloak/data
      - ../identity/minierp-realm.json:/opt/keycloak/data/import/minierp-local-realm.json:ro

volumes:
  identity-data:
