name: mini-erp-local

services:
  postgres:
    image: postgres:18.6
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in the local environment file}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in the local environment file}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the local environment file}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  api:
    build:
      context: ../..
      dockerfile: deploy/docker/api.Dockerfile
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: "8080"
      Cors__WebOrigin: "http://localhost:${WEB_PORT:-3000}"
      Media__S3Endpoint: http://object-storage:9000
      Media__AccessKey: ${OBJECT_STORAGE_ACCESS_KEY:?Set OBJECT_STORAGE_ACCESS_KEY in the local environment file}
      Media__SecretKey: ${OBJECT_STORAGE_SECRET_KEY:?Set OBJECT_STORAGE_SECRET_KEY in the local environment file}
      ConnectionStrings__Primary: "Host=postgres;Port=5432;Database=${POSTGRES_DB:?Set POSTGRES_DB in the local environment file};Username=${POSTGRES_USER:?Set POSTGRES_USER in the local environment file};Password=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the local environment file}"
    ports:
      - "127.0.0.1:${API_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8080/health/live"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

  web:
    build:
      context: ../..
      dockerfile: deploy/docker/web.Dockerfile
      args:
        VITE_API_URL: http://127.0.0.1:${API_PORT:-8080}
        VITE_APP_ENVIRONMENT: Development
    restart: unless-stopped
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/dashboard"]
      interval: 30s
      timeout: 3s
      retries: 3
    depends_on:
      api:
        condition: service_healthy

  worker:
    build:
      context: ../..
      dockerfile: deploy/docker/worker.Dockerfile
    restart: unless-stopped
    environment:
      DOTNET_ENVIRONMENT: Development
      ConnectionStrings__Primary: "Host=postgres;Port=5432;Database=${POSTGRES_DB:?Set POSTGRES_DB in the local environment file};Username=${POSTGRES_USER:?Set POSTGRES_USER in the local environment file};Password=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the local environment file}"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "sh", "-c", "kill -0 1"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

  redis:
    image: redis:8.10.2
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  object-storage:
    image: rustfs/rustfs:1.0.4
    restart: unless-stopped
    command: ["/data/rustfs0"]
    depends_on:
      object-storage-permissions:
        condition: service_completed_successfully
    environment:
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ADDRESS: 0.0.0.0:9001
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_ACCESS_KEY: ${OBJECT_STORAGE_ACCESS_KEY:?Set OBJECT_STORAGE_ACCESS_KEY in the local environment file}
      RUSTFS_SECRET_KEY: ${OBJECT_STORAGE_SECRET_KEY:?Set OBJECT_STORAGE_SECRET_KEY in the local environment file}
    ports:
      - "127.0.0.1:${OBJECT_STORAGE_PORT:-9000}:9000"
      - "127.0.0.1:${OBJECT_STORAGE_CONSOLE_PORT:-9001}:9001"
    volumes:
      - object-storage-data:/data/rustfs0
      - object-storage-logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9000/health/ready >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

  object-storage-permissions:
    image: rustfs/rustfs:1.0.4
    user: "0:0"
    entrypoint: ["/bin/sh", "-c"]
    command: ["chown 10001:10001 /data/rustfs0 /logs"]
    restart: "no"
    volumes:
      - object-storage-data:/data/rustfs0
      - object-storage-logs:/logs

volumes:
  postgres-data:
  redis-data:
  object-storage-data:
  object-storage-logs:
