# Disposable synthetic data only. Never combine this file with the local data stack.
services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.8.1
    command: [start-dev, --import-realm]
    environment:
      KC_HOSTNAME: http://127.0.0.1:18091
      KC_HEALTH_ENABLED: 'true'
    ports:
      - '127.0.0.1:18091:8080'
    volumes:
      - ../../TestResults/identity/ci-realm.json:/opt/keycloak/data/import/minierp-ci-realm.json:ro
    healthcheck:
      test: [CMD-SHELL, "bash -c 'exec 3<>/dev/tcp/127.0.0.1/9000; printf \"GET /health/ready HTTP/1.0\\r\\n\\r\\n\" >&3; head -1 <&3 | grep -q 200'"]
      interval: 5s
      timeout: 3s
      retries: 40
      start_period: 30s
  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_DB: minierp_ci
      POSTGRES_USER: minierp_ci
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Required}
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 3s
      timeout: 3s
      retries: 30
  redis:
    image: redis:8.10.2
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 3s
      timeout: 3s
      retries: 30
  object-storage:
    build:
      context: ../..
      dockerfile: deploy/docker/minio.Dockerfile
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${OBJECT_STORAGE_ACCESS_KEY:?Required}
      MINIO_ROOT_PASSWORD: ${OBJECT_STORAGE_SECRET_KEY:?Required}
    healthcheck:
      test: [CMD, curl, -fsS, http://localhost:9000/minio/health/ready]
      interval: 3s
      timeout: 3s
      retries: 30
  api:
    build:
      context: ../..
      dockerfile: deploy/docker/api.Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_HTTP_PORTS: '8080'
      Auth__Authority: http://127.0.0.1:18091/realms/minierp-ci
      Auth__Audience: minierp-api
      Auth__BackchannelBaseUrl: http://keycloak:8080
      ConnectionStrings__Primary: 'Host=postgres;Database=minierp_ci;Username=minierp_ci;Password=${POSTGRES_PASSWORD:?Required}'
      Media__S3Endpoint: http://object-storage:9000
      Media__AccessKey: ${OBJECT_STORAGE_ACCESS_KEY:?Required}
      Media__SecretKey: ${OBJECT_STORAGE_SECRET_KEY:?Required}
    depends_on:
      keycloak: {condition: service_healthy}
      postgres: {condition: service_healthy}
      object-storage: {condition: service_healthy}
    healthcheck:
      test: [CMD, curl, -fsS, http://localhost:8080/health/live]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s
  worker:
    build:
      context: ../..
      dockerfile: deploy/docker/worker.Dockerfile
    environment:
      DOTNET_ENVIRONMENT: Production
    healthcheck:
      test: [CMD, sh, -c, kill -0 1]
      interval: 5s
      timeout: 3s
      retries: 10
  web:
    build:
      context: ../..
      dockerfile: deploy/docker/web.Dockerfile
      args:
        VITE_OIDC_AUTHORITY: http://127.0.0.1:18091/realms/minierp-ci
        VITE_OIDC_CLIENT_ID: minierp-web
    environment:
      API_UPSTREAM: http://api:8080
    ports:
      - '127.0.0.1:${CI_WEB_PORT:-13000}:80'
    depends_on:
      api: {condition: service_healthy}
    healthcheck:
      test: [CMD, wget, -q, --spider, http://127.0.0.1/dashboard]
      interval: 5s
      timeout: 3s
      retries: 20
