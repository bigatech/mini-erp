name: Test
on:
  push:
    branches: [main, develop, 'codex/**']
  pull_request:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore MiniErp.sln
      - run: dotnet test MiniErp.sln --no-restore --configuration Release --logger trx --results-directory TestResults
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: TestResults/*.trx
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      COMPOSE_PROJECT_NAME: minierp-ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate disposable CI credentials
        shell: bash
        run: |
          node scripts/ci/prepare-identity.cjs
      - name: Start isolated stack with real OIDC provider
        run: docker compose --env-file deploy/environments/ci.env -f deploy/compose/ci.yaml up -d --build --wait --wait-timeout 300
      - name: Install browser for UI smoke
        run: |
          npm install --prefix "$RUNNER_TEMP/ui" playwright@1.56.1
          "$RUNNER_TEMP/ui/node_modules/.bin/playwright" install --with-deps chromium
      - name: API, persistence, S3 and UI integration smoke
        env:
          NODE_PATH: ${{ runner.temp }}/ui/node_modules
        run: node scripts/ci/smoke.cjs
      - name: Verify PostgreSQL and Redis protocols
        run: |
          docker compose --env-file deploy/environments/ci.env -f deploy/compose/ci.yaml exec -T postgres sh -c 'pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"'
          test "$(docker compose --env-file deploy/environments/ci.env -f deploy/compose/ci.yaml exec -T redis redis-cli ping)" = PONG
      - name: Verify persistence after API restart
        env:
          NODE_PATH: ${{ runner.temp }}/ui/node_modules
        run: |
          docker compose --env-file deploy/environments/ci.env -f deploy/compose/ci.yaml restart api
          docker compose --env-file deploy/environments/ci.env -f deploy/compose/ci.yaml up -d --wait --wait-timeout 120
          node scripts/ci/smoke.cjs --persistence-only
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: synthetic-ui-evidence
          path: TestResults/ci-ui.png
      - name: Collect status
        if: always()
        run: |
          docker compose --env-file deploy/environments/ci.env -f deploy/compose/ci.yaml ps -a
          docker compose --env-file deploy/environments/ci.env -f deploy/compose/ci.yaml logs --no-color --tail 40 web
      - name: Remove disposable stack
        if: always()
        run: docker compose --env-file deploy/environments/ci.env -f deploy/compose/ci.yaml down --volumes --remove-orphans
